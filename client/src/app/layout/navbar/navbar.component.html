<mat-toolbar color="primary" class="navbar">
  <button mat-icon-button class="menu-toggle" (click)="menuToggle.emit()" aria-label="Toggle navigation">
    <mat-icon>menu</mat-icon>
  </button>

  <mat-icon class="brand-icon">groups</mat-icon>
  <span class="brand">Employee Search</span>

  <span class="spacer"></span>

  @if (auth.currentUser(); as user) {
    <button mat-button [matMenuTriggerFor]="userMenu" class="user-chip">
      <mat-icon>account_circle</mat-icon>
      <span class="username">{{ user.username }}</span>
      <span class="role-badge">{{ user.role }}</span>
    </button>
    <mat-menu #userMenu="matMenu">
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Log out</span>
      </button>
    </mat-menu>
  }
</mat-toolbar>
